<!DOCTYPE html>
<html lang="nl">
<head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .card{width:1200px;height:630px;background:linear-gradient(135deg,#0e3b3b 0%,#12494a 100%);
    font-family:Segoe UI,Arial,sans-serif;color:#fff;position:relative;overflow:hidden;box-sizing:border-box;padding:80px}
  .sun{position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#f7cf5b 0%,#f4b400 70%);opacity:.9}
  .kicker{color:#f4b400;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:26px}
  h1{font-size:78px;line-height:1.05;margin:18px 0 22px;max-width:820px}
  p{font-size:34px;color:#cfe8e2;max-width:760px;margin:0}
  .foot{position:absolute;bottom:70px;left:80px;font-size:26px;color:#9fc4bd}
</style></head>
<body>
  <div class="card">
    <div class="sun"></div>
    <div class="kicker">Zonnestroom Baarn</div>
    <h1>Zonnepanelen in Baarn en het Gooi</h1>
    <p>Installatie, onderhoud &amp; thuisbatterijen — 12 jaar ervaring.</p>
    <div class="foot">zonnestroombaarn.nl</div>
  </div>
</body>
</html>
